[package]
name = "sinopec-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Sinopec Fuel Card Invoice Automation & AI Research Server (REST + MCP + Steel CDP)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "time", "sync", "process", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["connect"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
rust_decimal = { version = "1.36", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
url = "2.5"
encoding_rs = "0.8"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "ws", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
jpeg-decoder = "0.3"

