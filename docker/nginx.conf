server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://sinopec-server:8788/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /human/ {
        proxy_pass http://sinopec-server:8788/human/;
        proxy_set_header Host $host;
    }

    location /mcp {
        proxy_pass http://sinopec-server:8788/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
