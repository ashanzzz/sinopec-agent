name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rust-backend:
    name: Rust Format, Clippy & Test (Fixtures Only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL and SQLite dev headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run unit, integration, and 26-point acceptance tests
        run: cargo test --all

  web-frontend:
    name: React Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm --prefix web install
      - name: Frontend TypeScript lint
        run: npm --prefix web run lint
      - name: Frontend production build
        run: npm --prefix web run build
